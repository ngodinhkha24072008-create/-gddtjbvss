name: Build Rubik APK

on:
  push:
    paths:
      - 'rubik/CubeSolver/**'
      - '.github/workflows/build-rubik.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: rubik/CubeSolver
        run: gradle --no-daemon assembleDebug

      - name: Name the APK
        run: cp rubik/CubeSolver/app/build/outputs/apk/debug/app-debug.apk rubik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rubik-apk
          path: rubik.apk
