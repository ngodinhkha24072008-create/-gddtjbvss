name: Build Rubik APK

on:
  push:
    paths:
      - 'rubik/CubeSolver/**'
      - '.github/workflows/build-rubik.yml'
  workflow_dispatch:

permissions:
  contents: write   # lets the build save rubik.apk at the top of the branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: rubik/CubeSolver
        run: gradle --no-daemon assembleDebug

      - name: Name the APK
        run: cp rubik/CubeSolver/app/build/outputs/apk/debug/app-debug.apk rubik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rubik-apk
          path: rubik.apk

      # Save the finished app at the top of the repository, next to Controller.apk.
      - name: Commit rubik.apk to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f rubik.apk
          if git diff --cached --quiet; then
            echo "rubik.apk unchanged"
            exit 0
          fi
          git commit -m "Update rubik.apk (built from ${GITHUB_SHA::7})"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
