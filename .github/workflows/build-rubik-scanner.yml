name: Build Rubik Scanner (Windows)

on:
  push:
    paths:
      - 'rubik/WindowsScanner/**'
      - '.github/workflows/build-rubik-scanner.yml'
  workflow_dispatch:

permissions:
  contents: write   # lets the build save RubikScanner.exe at the top of the branch

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rubik/WindowsScanner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Test scanning and solving
        run: python tests/test_cube_logic.py

      # The fast (C) solver builds its lookup tables on first use; build them now so
      # they are packed into the .exe and the first solve is instant.
      - name: Build solver tables
        run: python -c "import kociemba; print(kociemba.solve('DRLUUBFBRBLURRLRUBLRDDFDLFUFUFFDBRDUBRUFLLFDDBFLUBLRBD'))"

      - name: Build RubikScanner.exe
        run: pyinstaller --noconfirm --onefile --windowed --name RubikScanner --collect-all kociemba rubik_scanner.py

      - name: Copy to the top of the repository
        shell: bash
        working-directory: .
        run: cp rubik/WindowsScanner/dist/RubikScanner.exe RubikScanner.exe

      - name: Commit RubikScanner.exe
        shell: bash
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f RubikScanner.exe
          if git diff --cached --quiet; then
            echo "RubikScanner.exe unchanged"
            exit 0
          fi
          git commit -m "Update RubikScanner.exe (built from ${GITHUB_SHA::7})"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
