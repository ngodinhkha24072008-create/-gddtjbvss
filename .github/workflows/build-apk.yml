name: Build gamepad APK

on:
  push:
    paths:
      - 'android/**'
      - 'controller/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RoverArmGamepad.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RoverArmGamepad-apk
          path: RoverArmGamepad.apk
