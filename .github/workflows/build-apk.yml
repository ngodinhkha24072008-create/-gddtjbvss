name: Build gamepad APK

on:
  push:
    paths:
      - 'android/**'
      - 'controller/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write   # lets the build save Controller.apk into the repository

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Controller.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Controller-apk
          path: Controller.apk

      # Save the finished app at the top of the repository so it can be
      # downloaded straight from the file list.
      - name: Commit Controller.apk to the repository
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Controller.apk
          if git diff --cached --quiet; then
            echo "Controller.apk unchanged"
            exit 0
          fi
          git commit -m "Update Controller.apk (built from ${GITHUB_SHA::7})"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
