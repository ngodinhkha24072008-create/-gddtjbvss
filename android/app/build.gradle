plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rover.armgamepad'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rover.armgamepad'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The gamepad screen is the same page as controller/index.html
    sourceSets {
        main {
            assets.srcDirs = ['../../controller']
        }
    }
}
